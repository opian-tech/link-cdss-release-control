name: Validate public release control

on:
  pull_request_target:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-pull-request:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CANDIDATE_ROOT: ${{ github.workspace }}/candidate
      PUBLIC_REPOSITORY_UNDER_TEST: ${{ github.workspace }}/candidate
    steps:
      - name: Checkout trusted base controls
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout pull request head as inert candidate data
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Run trusted release verifier tests
        working-directory: trusted
        run: python3 scripts/test_verify_release.py

      - name: Install Cosign v3.0.6
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad
        with:
          cosign-release: v3.0.6

      - name: Run trusted authenticity verifier tests
        working-directory: trusted
        run: python3 scripts/test_verify_authenticity.py

      - name: Run trusted repository policy tests against candidate
        working-directory: trusted
        run: python3 scripts/test_verify_repository_policy.py

      - name: Enforce trusted repository policy against candidate
        working-directory: trusted
        run: python3 scripts/verify_repository_policy.py "$CANDIDATE_ROOT"

  validate-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CANDIDATE_ROOT: ${{ github.workspace }}/candidate
      PUBLIC_REPOSITORY_UNDER_TEST: ${{ github.workspace }}/candidate
    steps:
      - name: Checkout previous trusted main controls
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.before }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout main candidate data
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Run trusted release verifier tests
        working-directory: trusted
        run: python3 scripts/test_verify_release.py

      - name: Install Cosign v3.0.6
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad
        with:
          cosign-release: v3.0.6

      - name: Run trusted authenticity verifier tests
        working-directory: trusted
        run: python3 scripts/test_verify_authenticity.py

      - name: Run trusted repository policy tests against candidate
        working-directory: trusted
        run: python3 scripts/test_verify_repository_policy.py

      - name: Enforce trusted repository policy against candidate
        working-directory: trusted
        run: python3 scripts/verify_repository_policy.py "$CANDIDATE_ROOT"
